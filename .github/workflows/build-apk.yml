name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Build fullscreen WebView APK
        working-directory: android-webview
        run: ./gradlew assembleRelease --no-daemon

      - name: Copy release APK
        run: |
          APK=$(find android-webview/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" KolayDilOgren.apk
          ls -lh KolayDilOgren.apk

      - name: Delete old release if exists
        run: |
          gh release delete android-latest --yes 2>/dev/null || true
          git push origin :refs/tags/android-latest 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "Android APK — Kolay Dil Öğren (WebView)"
          body: |
            📱 **Kolay Dil Öğren** Android uygulaması (tam ekran WebView)

            ⬇️ `KolayDilOgren.apk` dosyasını indirin ve kurun.

            Bu sürüm Chrome adres çubuğu göstermez — uygulama tam ekran açılır.

            > ℹ️ Kurulum: Ayarlar → Güvenlik → Bilinmeyen kaynaklardan yüklemeye izin ver
            > ⚠️ Eski APK'yı kaldırıp yeniden kurun veya üzerine yazın.
          files: KolayDilOgren.apk
          token: ${{ secrets.GITHUB_TOKEN }}
