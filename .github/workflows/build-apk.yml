name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@1.25.0

      - name: Build clean Android SDK for bubblewrap
        run: |
          CLEAN=/tmp/bw-sdk
          mkdir -p "$CLEAN/cmdline-tools/latest"
          mkdir -p "$CLEAN/licenses"

          CT="$ANDROID_HOME/cmdline-tools"
          echo "Available cmdline-tools: $(ls $CT)"

          # Prefer 'latest-2' — it has Pkg.Path=cmdline-tools;latest in source.properties
          # Fall back to highest numeric version, then 'latest'
          if [ -d "$CT/latest-2" ]; then
            SRC="$CT/latest-2"
          else
            BEST=$(ls "$CT" | grep -E '^[0-9]' | sort -V | tail -1)
            SRC="$CT/${BEST:-latest}"
          fi
          echo "Copying from: $SRC"

          cp -r "$SRC/." "$CLEAN/cmdline-tools/latest/"
          chmod +x "$CLEAN/cmdline-tools/latest/bin/"*

          # Force source.properties to claim Pkg.Path=cmdline-tools;latest
          # so sdkmanager doesn't report an inconsistency warning for this package
          PROPS="$CLEAN/cmdline-tools/latest/source.properties"
          if [ -f "$PROPS" ]; then
            sed -i 's/^Pkg\.Path=.*/Pkg.Path=cmdline-tools;latest/' "$PROPS"
            echo "source.properties: $(cat $PROPS)"
          fi

          # Symlink the already-installed SDK components
          ln -sf "$ANDROID_HOME/build-tools"    "$CLEAN/build-tools"
          ln -sf "$ANDROID_HOME/platforms"      "$CLEAN/platforms"
          ln -sf "$ANDROID_HOME/platform-tools" "$CLEAN/platform-tools"

          # Copy accepted licenses
          cp "$ANDROID_HOME/licenses/"* "$CLEAN/licenses/" 2>/dev/null || true

          # Verify: sdkmanager without --sdk_root (how bubblewrap calls it)
          echo "=== sdkmanager (no --sdk_root) ==="
          "$CLEAN/cmdline-tools/latest/bin/sdkmanager" --version 2>&1 || echo "FAILED"

          # Accept licenses
          yes | "$CLEAN/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$CLEAN" --licenses 2>&1 | tail -3

          # Show what bubblewrap's validation actually checks (use npm root -g for correct path)
          echo "=== bubblewrap AndroidSdkTools validation ==="
          NPMROOT=$(npm root -g 2>/dev/null || echo "")
          echo "npm global root: $NPMROOT"
          BWFILE=$(find "$NPMROOT/@bubblewrap" -name "AndroidSdkTools.js" 2>/dev/null | head -1)
          echo "Found: $BWFILE"
          [ -n "$BWFILE" ] && grep -n "androidSdk isn't correct\|validateAndroid\|sdkmanager\|access\|exists" "$BWFILE" | head -30 || echo "File not found in $NPMROOT"

          # Node.js exact replication of bubblewrap's fs.access check
          echo "=== Node.js access check ==="
          node -e "
            const fs = require('fs');
            const mgr = '/tmp/bw-sdk/cmdline-tools/latest/bin/sdkmanager';
            console.log('existsSync:', fs.existsSync(mgr));
            try { fs.accessSync(mgr, fs.constants.R_OK | fs.constants.X_OK); console.log('accessSync R|X: OK'); }
            catch(e) { console.log('accessSync FAIL:', e.message); }
            try { const s = fs.lstatSync(mgr); console.log('mode:', s.mode.toString(8), 'size:', s.size); }
            catch(e) { console.log('lstat FAIL:', e.message); }
          "

          # Point bubblewrap at the clean SDK
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$CLEAN\"}" > ~/.bubblewrap/config.json
          echo "Config: $(cat ~/.bubblewrap/config.json)"

          echo "ANDROID_HOME=$CLEAN" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$CLEAN" >> $GITHUB_ENV

      - name: Prepare keystore
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > kdo.keystore
          else
            keytool -genkey -v \
              -keystore kdo.keystore \
              -alias kdo \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Kolay Dil Ogren,O=Ali Dincir,C=TR"
          fi
          SHA256=$(keytool -list -v -keystore kdo.keystore -alias kdo \
            -storepass android 2>/dev/null | grep "SHA256:" | awk '{print $2}')
          echo "SHA256=$SHA256" >> $GITHUB_ENV
          echo "Signing fingerprint: $SHA256"
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

      - name: Update assetlinks.json with real fingerprint
        run: |
          cat > .well-known/assetlinks.json << ENDJSON
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "io.alid67.kolaydilogren",
              "sha256_cert_fingerprints": ["${SHA256}"]
            }
          }]
          ENDJSON

      - name: Build TWA APK
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --manifest twa-manifest.json
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: android
          BUBBLEWRAP_KEY_PASSWORD: android

      - name: Locate and rename APK
        run: |
          APK_PATH=$(find . -path "*/build/outputs/apk/*/*.apk" | head -1)
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" KolayDilOgren.apk

      - name: Delete old release if exists
        run: |
          gh release delete android-latest --yes 2>/dev/null || true
          git push origin :refs/tags/android-latest 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "Android APK — Kolay Dil Öğren"
          body: |
            📱 **Kolay Dil Öğren** Android uygulaması

            ⬇️ `KolayDilOgren.apk` dosyasını indirin ve kurun.

            > ℹ️ Kurulum: Ayarlar → Güvenlik → Bilinmeyen kaynaklardan yüklemeye izin ver
          files: KolayDilOgren.apk
          token: ${{ secrets.GITHUB_TOKEN }}
