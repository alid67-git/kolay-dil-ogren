name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Fix SDK structure for Bubblewrap
        run: |
          # Bubblewrap validatePath checks: existsSync(sdk/tools) OR existsSync(sdk/bin)
          # android-actions puts cmdline-tools at $ANDROID_HOME/cmdline-tools/<version>/
          # but neither sdk/tools nor sdk/bin exists → validation fails.
          # Fix: create sdk/bin symlink pointing to cmdline-tools/latest/bin (or highest version)
          CT="$ANDROID_HOME/cmdline-tools"
          if [ -d "$CT/latest" ]; then
            CTBIN="$CT/latest/bin"
          else
            VER=$(ls "$CT" | sort -V | tail -1)
            CTBIN="$CT/$VER/bin"
          fi
          echo "cmdline-tools bin: $CTBIN"
          ln -sf "$CTBIN" "$ANDROID_HOME/bin"

          # Ensure licenses dir exists with accepted hashes
          mkdir -p "$ANDROID_HOME/licenses"
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

          echo "SDK structure:"
          ls -la "$ANDROID_HOME/"
          echo "bin link target: $(readlink -f $ANDROID_HOME/bin)"

          # Write bubblewrap config
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          echo "Bubblewrap config: $(cat ~/.bubblewrap/config.json)"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@1.25.0

      - name: Prepare keystore
        run: |
          KPASS="${KEYSTORE_PASSWORD:-android}"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > kdo.keystore
          else
            # Fallback: generate a temporary keystore (APK won't be upgradeable across builds)
            KPASS="android"
            keytool -genkey -v \
              -keystore kdo.keystore \
              -alias kdo \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Kolay Dil Ogren,O=Ali Dincir,C=TR"
          fi
          SHA256=$(keytool -list -v -keystore kdo.keystore -alias kdo \
            -storepass "$KPASS" 2>/dev/null | grep "SHA256:" | awk '{print $2}')
          echo "SHA256=$SHA256" >> $GITHUB_ENV
          echo "KPASS=$KPASS" >> $GITHUB_ENV
          echo "Signing fingerprint: $SHA256"
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Update assetlinks.json with real fingerprint
        run: |
          node -e "
            const fs = require('fs');
            const data = [{
              relation: ['delegate_permission/common.handle_all_urls'],
              target: {
                namespace: 'android_app',
                package_name: 'io.alid67.kolaydilogren',
                sha256_cert_fingerprints: ['${SHA256}']
              }
            }];
            fs.writeFileSync('.well-known/assetlinks.json', JSON.stringify(data, null, 2));
          "

      - name: Generate TWA project
        run: |
          # bubblewrap build without a checksum.json asks interactively to regenerate.
          # Run `bubblewrap update` first (non-interactive) to create/update the project
          # and produce the checksum file, then build without any prompts.
          echo "y" | bubblewrap update --skipPwaValidation --manifest twa-manifest.json || true
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}

      - name: Build TWA APK
        run: |
          echo "y" | bubblewrap build \
            --skipPwaValidation \
            --manifest twa-manifest.json
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}

      - name: Locate and rename APK
        run: |
          APK_PATH=$(find . -path "*/build/outputs/apk/*/*.apk" | head -1)
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" KolayDilOgren.apk

      - name: Delete old release if exists
        run: |
          gh release delete android-latest --yes 2>/dev/null || true
          git push origin :refs/tags/android-latest 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "Android APK — Kolay Dil Öğren"
          body: |
            📱 **Kolay Dil Öğren** Android uygulaması

            ⬇️ `KolayDilOgren.apk` dosyasını indirin ve kurun.

            > ℹ️ Kurulum: Ayarlar → Güvenlik → Bilinmeyen kaynaklardan yüklemeye izin ver
          files: KolayDilOgren.apk
          token: ${{ secrets.GITHUB_TOKEN }}
