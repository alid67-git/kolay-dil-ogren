import java.util.Properties

plugins {
    id 'com.android.application'
}

// Play Store upload key — loaded from a local, gitignored properties file.
// Never committed. Only present on a machine preparing a Play Store release.
// CI and sideload builds never have this file, so playRelease signing
// simply uses the sideload keystore in that case.
def playKeystorePropertiesFile = rootProject.file("keystore.properties")
def playKeystoreProperties = new Properties()
if (playKeystorePropertiesFile.exists()) {
    playKeystoreProperties.load(new FileInputStream(playKeystorePropertiesFile))
}

android {
    namespace 'io.alid67.kolaydilogren'
    // Play Console requires targeting at least API 36.
    compileSdk 36

    defaultConfig {
        applicationId 'io.alid67.kolaydilogren'
        minSdk 21
        targetSdk 36
        versionCode 31
        versionName '3.0.90'
        // Sideload/debug builds have no paywall. Only playRelease flips this on.
        buildConfigField 'boolean', 'PAYWALL_ENABLED', 'false'
    }

    signingConfigs {
        release {
            storeFile file('../../kdo.keystore')
            storePassword 'kdo2024release'
            keyAlias 'kdo'
            keyPassword 'kdo2024release'
        }
        if (playKeystorePropertiesFile.exists()) {
            playRelease {
                storeFile file(playKeystoreProperties.getProperty('storeFile'))
                storePassword playKeystoreProperties.getProperty('storePassword')
                keyAlias playKeystoreProperties.getProperty('keyAlias')
                keyPassword playKeystoreProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
        }
        // Play Store build: paywall on. Build with: ./gradlew bundlePlayRelease
        playRelease {
            initWith release
            if (playKeystorePropertiesFile.exists()) {
                signingConfig signingConfigs.playRelease
            }
            buildConfigField 'boolean', 'PAYWALL_ENABLED', 'true'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        // BuildConfig generation is opt-in since AGP 8 — needed for PAYWALL_ENABLED.
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'com.google.android.material:material:1.11.0'
    // Google Play Billing for the Play-only subscription paywall.
    implementation 'com.android.billingclient:billing:8.0.0'
}
